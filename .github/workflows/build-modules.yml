name: Build module images

# Builds the per-module images and publishes them to GHCR, so students pull them
# instead of building locally:
#   ghcr.io/<owner>/assume-breach-node       (Module 07 firewall/workstations/DNS)
#   ghcr.io/<owner>/assume-breach-cracking   (Module 03 cracking workstation)
# The base image is built separately by build-base.yml; assume-breach-cracking is
# FROM that base, so this workflow runs after it.

on:
  push:
    branches: [main]
    paths:
      - modules/module-01-access-control/**
      - modules/module-07-firewalls/**
      - modules/module-03-password-attacks/**
      - modules/module-02-port-scanning/**
      - modules/module-04-cryptography/**
      - modules/module-05-risk/**
      - modules/module-06-packet-capture/**
      - modules/module-08-forensics/**
      - modules/module-09-human-factors/**
      - modules/module-11-vpn/**
      - .github/workflows/build-modules.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: assume-breach-accesslab
            context: modules/module-01-access-control/station
            file: modules/module-01-access-control/station/Dockerfile
          - name: assume-breach-attacker
            context: modules/module-02-port-scanning/attacker
            file: modules/module-02-port-scanning/attacker/Dockerfile
          - name: assume-breach-node
            context: modules/module-07-firewalls
            file: modules/module-07-firewalls/node/Dockerfile
          - name: assume-breach-cracking
            context: modules/module-03-password-attacks/station
            file: modules/module-03-password-attacks/station/Dockerfile
          - name: assume-breach-target
            context: modules/module-02-port-scanning/target
            file: modules/module-02-port-scanning/target/Dockerfile
          - name: assume-breach-crypto
            context: modules/module-04-cryptography/station
            file: modules/module-04-cryptography/station/Dockerfile
          - name: assume-breach-riskcalc
            context: modules/module-05-risk/web
            file: modules/module-05-risk/web/Dockerfile
          - name: assume-breach-wireshark
            context: modules/module-06-packet-capture/wireshark
            file: modules/module-06-packet-capture/wireshark/Dockerfile
          - name: assume-breach-forensics
            context: modules/module-08-forensics/station
            file: modules/module-08-forensics/station/Dockerfile
          - name: assume-breach-quiz
            context: modules/module-09-human-factors/quiz
            file: modules/module-09-human-factors/quiz/Dockerfile
          - name: assume-breach-badcerts
            context: modules/module-09-human-factors/badcerts
            file: modules/module-09-human-factors/badcerts/Dockerfile
          - name: assume-breach-vpn
            context: modules/module-11-vpn/node
            file: modules/module-11-vpn/node/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
