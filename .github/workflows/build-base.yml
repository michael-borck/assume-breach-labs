name: Build base image

# Builds base.Dockerfile and publishes it to GHCR as
# ghcr.io/michael-borck/assume-breach-base so students can pull the toolbox image
# instead of building it. base.Dockerfile stays in the repo as a fallback:
# `make build-base` tags a local build with the same image name.

on:
  push:
    branches: [main]
    paths:
      - base.Dockerfile
      - .github/workflows/build-base.yml
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (linux/amd64,linux/arm64)"
        required: false
        default: "linux/amd64,linux/arm64"
  schedule:
    # Refresh weekly — Kali rolling + tool packages update frequently.
    - cron: "17 4 * * 1"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/assume-breach-base

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=schedule

      # The workflow_dispatch input is passed through `env:` rather than
      # interpolated straight into the script. Interpolating ${{ inputs.* }} into a
      # run: block splices the value into the shell before it executes, so input
      # text can be read as commands. Via env: it stays a plain string.
      - name: Resolve platforms
        id: plat
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          if [ -n "$INPUT_PLATFORMS" ]; then
            printf 'platforms=%s\n' "$INPUT_PLATFORMS" >> "$GITHUB_OUTPUT"
          else
            printf 'platforms=%s\n' "linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./base.Dockerfile
          platforms: ${{ steps.plat.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
